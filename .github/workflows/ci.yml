name: CI — Jungle Gaming Backend

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check gofmt & go vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -count=1 -race ./...

      - name: Start Docker Compose Stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then
              echo "Stack is healthy!"
              break
            fi
            sleep 2
          done

      - name: Run Integration & Concurrency Tests
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/jungle_gaming?sslmode=disable"
          AWS_ENDPOINT_URL: "http://localhost:4566"
          KEYCLOAK_ISSUER_URL: "http://localhost:8081/realms/jungle-gaming"
        run: go test -v -count=1 -tags=integration -race ./tests/integration/...

      - name: Run E2E Postman Collection via Newman
        run: npx --yes newman run deployments/postman/jungle-gaming.postman_collection.json

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v